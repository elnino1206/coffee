<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — Al Jar Coffee</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="cart">
  <div data-header></div>
  <main id="main" class="container">
    <div class="page-hero">
      <nav class="breadcrumbs"><a href="index.html">Главная</a> · Корзина</nav>
      <h1 class="h2">Корзина</h1>
    </div>
    <div class="checkout">
      <div>
        <div data-cart></div>
        <div style="margin-top:32px">
          <h2 class="h3" style="margin-bottom:12px">Добавить к заказу</h2>
          <div class="product-grid" data-upsell></div>
        </div>
      </div>
      <aside class="summary" data-summary>
        <h2 class="h3">Итого</h2>
        <div class="totals">
          <div><span>Товары</span><span data-subtotal>0 ₽</span></div>
          <div><span>Доставка</span><span data-delivery>—</span></div>
          <div class="grand"><span>К оплате</span><span data-grand>0 ₽</span></div>
        </div>
        <p class="tiny">Бесплатная доставка от 3 000 ₽</p>
        <a class="btn btn--petrol btn--block" href="checkout.html">Оформить заказ</a>
      </aside>
    </div>
  </main>
  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
