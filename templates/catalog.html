<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог кофе — Al Jar Coffee</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
  <div data-header></div>
  <main id="main" class="container">
    <div class="page-hero">
      <nav class="breadcrumbs"><a href="index.html">Главная</a> · Каталог</nav>
      <h1 class="h2">Наш кофе</h1>
      <p class="lead">10 позиций. Дата обжарки на каждой карточке. Фильтры работают вместе.</p>
    </div>

    <div class="toolbar">
      <input class="field" style="max-width:280px" type="search" placeholder="Поиск кофе…" data-catalog-q>
      <div class="cluster">
        <label class="tiny">Сортировка
          <select class="select" data-sort>
            <option value="fresh">По свежести</option>
            <option value="rating">По рейтингу</option>
            <option value="price-asc">Цена ↑</option>
            <option value="price-desc">Цена ↓</option>
          </select>
        </label>
      </div>
    </div>
    <div class="chips" data-chips></div>
    <p class="tiny" data-count></p>
    <button class="btn btn--ghost btn--m filters-toggle" type="button" id="filters-toggle">Фильтры</button>

    <div class="catalog-layout">
      <aside class="filters" id="filters-panel">
        <h3>Обжарка</h3>
        <label class="filter-option"><span><input type="checkbox" data-filter-roast="light"> Светлая</span></label>
        <label class="filter-option"><span><input type="checkbox" data-filter-roast="medium"> Средняя</span></label>
        <label class="filter-option"><span><input type="checkbox" data-filter-roast="dark"> Тёмная</span></label>
        <h3>Регион</h3>
        <label class="filter-option"><span><input type="checkbox" data-filter-origin="Бразилия"> Бразилия</span></label>
        <label class="filter-option"><span><input type="checkbox" data-filter-origin="Эфиопия"> Эфиопия</span></label>
        <label class="filter-option"><span><input type="checkbox" data-filter-origin="Колумбия"> Колумбия</span></label>
        <label class="filter-option"><span><input type="checkbox" data-filter-origin="Смесь"> Смесь</span></label>
        <h3>Приготовление</h3>
        <label class="filter-option"><span><input type="checkbox" data-filter-method="espresso"> Эспрессо</span></label>
        <label class="filter-option"><span><input type="checkbox" data-filter-method="filter"> Фильтр</span></label>
        <label class="filter-option"><span><input type="checkbox" data-filter-method="cezve"> Турка</span></label>
        <button class="btn btn--ghost btn--m btn--block" type="button" data-clear-filters style="margin-top:16px">Сбросить всё</button>
      </aside>
      <div class="product-grid" data-catalog></div>
    </div>
  </main>

  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
