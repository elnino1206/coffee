<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дашборд — Al Jar Coffee</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=f6b64890">
  <link rel="stylesheet" href="css/admin.css?v=30aa12fc">
</head>
<body class="admin" data-admin-page="dashboard">
  <aside class="admin-nav" data-admin-nav></aside>

  <div class="admin-main">
    <header class="admin-topbar" data-admin-topbar
            data-title="Дашборд"
            data-note="Сводка по продажам и свежести склада"></header>

    <div class="admin-content" data-dashboard>
      <div class="admin-stats" data-stats></div>

      <div class="admin-cols">
        <section class="admin-panel">
          <div class="admin-panel__head">
            <h2>Последние заказы</h2>
            <a class="admin-btn admin-panel__aside" href="orders.html">Все заказы</a>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Номер</th><th>Дата</th><th>Покупатель</th>
                  <th class="num">Позиций</th><th>Доставка</th>
                  <th class="num">Сумма</th><th>Статус</th><th></th>
                </tr>
              </thead>
              <tbody data-orders data-orders-limit="4" data-orders-compact></tbody>
            </table>
          </div>
        </section>

        <section class="admin-panel">
          <div class="admin-panel__head">
            <h2>Свежесть склада</h2>
            <a class="admin-btn admin-panel__aside" href="products.html">Товары</a>
          </div>
          <div class="admin-panel__body">
            <p class="tiny" style="margin-bottom:10px">Дата обжарки — главный аргумент бренда. Позиции отсортированы от самых залежавшихся.</p>
            <div class="roast-list" data-roast-watch></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="../js/data.js?v=428019e9"></script>
  <script src="js/demo.js?v=f466f16c"></script>
  <script src="js/admin.js?v=80b80cc8"></script>
</body>
</html>
