<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Товары — Al Jar Coffee</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="../css/styles.css?v=075b1c42">
  <link rel="stylesheet" href="css/admin.css?v=30aa12fc">
</head>
<body class="admin" data-admin-page="products">
  <aside class="admin-nav" data-admin-nav></aside>

  <div class="admin-main">
    <header class="admin-topbar" data-admin-topbar
            data-title="Товары"
            data-note="10 позиций каталога и даты обжарки"
            data-actions='<button class="btn btn--petrol btn--m" type="button" data-create-product>Новая позиция</button>'></header>

    <div class="admin-content">
      <section class="admin-panel">
        <div class="admin-panel__head">
          <h2>Каталог</h2>
          <div class="admin-filters admin-panel__aside">
            <input class="field" type="search" placeholder="Название или регион">
            <select class="select">
              <option>Вся обжарка</option>
              <option>Светлая</option>
              <option>Средняя</option>
              <option>Тёмная</option>
            </select>
          </div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Позиция</th><th>Обжарка</th><th>Способ</th>
                <th class="num">Цена</th>
                <th class="num">Рейтинг</th><th></th>
              </tr>
            </thead>
            <tbody data-products></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="../js/data.js?v=0964016a"></script>
  <script src="js/demo.js?v=f466f16c"></script>
  <script src="js/admin.js?v=f069bea1"></script>
</body>
</html>
